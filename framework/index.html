<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How AI Fragility Fuels the Metacrisis</title>

<style>

:root{
  --green:#00ff88;
  --soft:#dcffee;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#00ff88;
  font-family:monospace;
  touch-action:manipulation;
}

/* =========================================================
   CRT
========================================================= */

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:500;

  background:
    repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,.03) 0px,
      rgba(255,255,255,.03) 1px,
      transparent 2px,
      transparent 4px
    );

  opacity:.12;
}

/* =========================================================
   BACKGROUND
========================================================= */

#bg{
  position:fixed;
  inset:0;
  z-index:1;
}

/* =========================================================
   TITLE
========================================================= */

.title{
  position:fixed;

  top:16px;
  left:50%;

  transform:translateX(-50%);

  width:min(96vw,1100px);

  text-align:center;

  font-size:clamp(11px,1.9vw,18px);

  letter-spacing:.22em;

  text-transform:uppercase;

  color:#d7fff0;

  text-shadow:
    0 0 14px #00ff88;

  z-index:100;
}

/* =========================================================
   STATUS
========================================================= */

.status{
  position:fixed;

  top:58px;
  left:50%;

  transform:translateX(-50%);

  opacity:.5;

  font-size:11px;

  letter-spacing:.16em;

  z-index:120;
}

/* =========================================================
   PORTAL
========================================================= */

.portal{
  position:fixed;

  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;
}

#viz{
  width:min(720px,96vw);
  height:min(720px,96vw);

  border-radius:50%;

  background:
    radial-gradient(circle at center,
      rgba(0,45,18,.96),
      rgba(0,0,0,1));

  border:
    2px solid rgba(0,255,120,.38);

  box-shadow:
    inset 0 0 120px rgba(0,255,120,.06),
    inset 0 0 40px rgba(0,255,120,.08),
    0 0 40px rgba(0,255,120,.16);

  z-index:40;
}

/* =========================================================
   SUBTITLES
========================================================= */

.subs{
  position:fixed;

  bottom:58px;

  left:0;
  right:0;

  margin:auto;

  width:min(920px,94vw);

  padding:10px 16px;

  min-height:3em;

  display:flex;

  align-items:center;
  justify-content:center;

  text-align:center;

  font-size:clamp(13px,3.4vw,17px);

  line-height:1.5;

  color:#d9fff0;

  text-shadow:
    0 0 10px rgba(0,255,120,.8);

  background:
    rgba(0,16,0,.34);

  border:
    1px solid rgba(0,255,120,.18);

  border-radius:8px;

  pointer-events:none;

  z-index:70;

  transition:
    opacity .15s ease,
    transform .08s ease;
}

/* =========================================================
   ESSAY
========================================================= */

.essay{
  position:fixed;

  bottom:14px;
  left:50%;

  transform:translateX(-50%);

  color:#9effd0;

  text-decoration:none;

  letter-spacing:.10em;

  font-size:11px;

  opacity:.72;

  z-index:90;
}

.essay:hover{
  opacity:1;
}

/* =========================================================
   GLITCH
========================================================= */

.glitch{
  position:fixed;
  inset:0;

  pointer-events:none;

  z-index:300;

  opacity:0;
}

.glitch.active{
  animation:glitch .18s linear;
}

@keyframes glitch{

  0%{
    opacity:0;
    transform:translate(0,0);

    background:
      repeating-linear-gradient(
        90deg,
        rgba(255,255,255,.08) 0px,
        transparent 2px,
        transparent 5px
      );
  }

  25%{
    opacity:.28;
    transform:translate(-16px,5px);
  }

  55%{
    opacity:.20;
    transform:translate(18px,-4px);
  }

  100%{
    opacity:0;
    transform:translate(0,0);
  }
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

  .status{
    top:64px;
    font-size:9px;
  }

  .subs{
    bottom:54px;
  }
}

</style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="title">
  HOW AI FRAGILITY FUELS THE METACRISIS
</div>

<div class="status">
  TOUCH / CLICK ANYWHERE TO PLAY OR PAUSE
</div>

<div class="portal">
  <canvas id="viz"></canvas>
</div>

<div class="subs" id="subs"></div>

<a class="essay"
href="https://standardgalactic.github.io/antivenom/framework/fragility-metacrisis.pdf"
target="_blank"
onclick="event.stopPropagation()">
BROKEN TOOLS FOR A BREAKING WORLD
</a>

<div class="glitch" id="glitch"></div>

<audio id="audio" preload="auto"></audio>

<script>

/* =========================================================
   AUDIO FILE
========================================================= */

const AUDIO_FILE =
  "How_AI_Fragility_Fuels_the_Metacrisis.mp3"

/* =========================================================
   ELEMENTS
========================================================= */

const audio =
  document.getElementById("audio")

const subs =
  document.getElementById("subs")

const glitch =
  document.getElementById("glitch")

/* =========================================================
   AUDIO
========================================================= */

let audioCtx
let analyser
let data

function initAudio(){

  if(audioCtx) return

  audioCtx =
    new (
      window.AudioContext ||
      window.webkitAudioContext
    )()

  analyser =
    audioCtx.createAnalyser()

  analyser.fftSize = 2048

  const src =
    audioCtx.createMediaElementSource(audio)

  src.connect(analyser)
  analyser.connect(audioCtx.destination)

  data =
    new Uint8Array(
      analyser.frequencyBinCount
    )
}

/* =========================================================
   SUBTITLES
========================================================= */

let cues = []

async function loadVTT(file){

  cues = []

  try{

    const r =
      await fetch(file)

    if(!r.ok){
      console.warn("Missing VTT:",file)
      return
    }

    const txt =
      await r.text()

    cues =
      parseVTT(txt)

  }catch(e){

    console.warn(e)
  }
}

function parseVTT(txt){

  const lines =
    txt.split('\n')

  const out = []

  let i = 0

  while(i < lines.length){

    const line =
      lines[i].trim()

    if(line.includes('-->')){

      const [s,e] =
        line.split('-->')
            .map(v=>v.trim())

      i++

      const text = []

      while(
        i < lines.length &&
        lines[i].trim()
      ){

        text.push(
          lines[i].trim()
        )

        i++
      }

      out.push({

        start:toSec(s),
        end:toSec(e),
        text:text.join('\n')

      })

    }else{

      i++
    }
  }

  return out
}

function toSec(t){

  const p =
    t.replace(',','.')
     .split(':')

  if(p.length===3){

    return (
      (+p[0])*3600 +
      (+p[1])*60 +
      (+p[2])
    )
  }

  return (
    (+p[0])*60 +
    (+p[1])
  )
}

audio.ontimeupdate = ()=>{

  const t =
    audio.currentTime

  const cue =
    cues.find(c=>
      t >= c.start &&
      t < c.end + .25
    )

  subs.textContent =
    cue ? cue.text : ""
}

/* =========================================================
   PLAY
========================================================= */

document.body.onclick =
  async ()=>{

    initAudio()

    if(audioCtx.state==="suspended")
      await audioCtx.resume()

    if(!audio.src){

      audio.src = AUDIO_FILE

      await loadVTT(
        AUDIO_FILE.replace('.mp3','.vtt')
      )

      try{
        await audio.play()
      }catch(e){}

      return
    }

    if(audio.paused){

      audio.play()

    }else{

      audio.pause()
    }
  }

/* =========================================================
   BACKGROUND
========================================================= */

const bg =
  document.getElementById("bg")

const bgc =
  bg.getContext("2d")

let SW,SH

function resizeBG(){

  SW =
    bg.width =
      innerWidth

  SH =
    bg.height =
      innerHeight
}

resizeBG()

addEventListener(
  'resize',
  resizeBG
)

const particles = []

for(
  let i=0;
  i<520;
  i++
){

  particles.push({

    x:Math.random()*SW,
    y:Math.random()*SH,

    vx:
      (Math.random()-.5)*1.1,

    vy:
      (Math.random()-.5)*1.1,

    z:
      Math.random()*2
  })
}

function drawBG(){

  bgc.clearRect(
    0,0,SW,SH
  )

  for(const p of particles){

    p.x += p.vx
    p.y += p.vy

    if(p.x < 0) p.x = SW
    if(p.x > SW) p.x = 0

    if(p.y < 0) p.y = SH
    if(p.y > SH) p.y = 0

    bgc.fillStyle =
      `rgba(180,255,220,${
        .015 + p.z*.06
      })`

    bgc.fillRect(
      p.x,
      p.y,
      p.z*1.5,
      p.z*1.5
    )
  }

  for(let i=0; i<particles.length; i+=9){

    const a = particles[i]
    const b = particles[(i+27)%particles.length]

    bgc.beginPath()

    bgc.moveTo(a.x,a.y)
    bgc.lineTo(b.x,b.y)

    bgc.strokeStyle =
      "rgba(120,255,180,0.01)"

    bgc.stroke()
  }
}

/* =========================================================
   GLITCHES
========================================================= */

setInterval(()=>{

  glitch.classList.add(
    'active'
  )

  setTimeout(()=>{

    glitch.classList.remove(
      'active'
    )

  },180)

},12000 + Math.random()*9000)

const originalTitle =
  document.querySelector('.title').textContent

setInterval(()=>{

  const title =
    document.querySelector('.title')

  const chars =
    originalTitle.split('')

  const index =
    Math.floor(
      Math.random()*chars.length
    )

  chars[index] =
    "▓"

  title.textContent =
    chars.join('')

  setTimeout(()=>{

    title.textContent =
      originalTitle

  },160)

},9000 + Math.random()*8000)

/* =========================================================
   CANVAS
========================================================= */

const canvas =
  document.getElementById("viz")

const ctx =
  canvas.getContext("2d")

const size = 820

canvas.width  = size
canvas.height = size

/* =========================================================
   STATE
========================================================= */

let phase = 0

let bassSmooth = 0
let midSmooth  = 0
let highSmooth = 0

let frame = 0

/* =========================================================
   DRAW
========================================================= */

function drawFragilityField(){

  if(analyser && data){

    analyser.getByteFrequencyData(data)

    let bass = 0
    let mid  = 0
    let high = 0

    for(let i=0;i<48;i++)
      bass += data[i]

    for(let i=48;i<220;i++)
      mid += data[i]

    for(let i=220;i<640;i++)
      high += data[i]

    bass /= 48 * 255
    mid  /= 172 * 255
    high /= 420 * 255

    bassSmooth +=
      (bass - bassSmooth) * 0.08

    midSmooth +=
      (mid - midSmooth) * 0.06

    highSmooth +=
      (high - highSmooth) * 0.05
  }

  phase +=
    0.02 + bassSmooth * 0.06

  const cx = size/2
  const cy = size/2

  ctx.save()

  ctx.beginPath()

  ctx.arc(
    cx,
    cy,
    size*0.47,
    0,
    Math.PI*2
  )

  ctx.clip()

  ctx.fillStyle =
    `rgba(0,5,0,${
      0.10 + bassSmooth*0.08
    })`

  ctx.fillRect(
    0,
    0,
    size,
    size
  )

  /* fractured rings */

  for(let i=0;i<24;i++){

    const r =
      size *
      (0.04 + i*0.018)

    ctx.beginPath()

    for(let a=0;a<=Math.PI*2+.02;a+=0.03){

      const fracture =

        Math.sin(
          a *
          (12 + i*0.4) +
          phase *
          (0.7 + i*0.03)
        ) *

        (2 + highSmooth*20)

      const wave =

        Math.sin(
          a *
          (3 + i*0.12) +
          phase *
          (0.4 + i*0.02)
        ) *

        (4 + midSmooth*18)

      const x =
        cx +
        Math.cos(a) * (r + wave + fracture)

      const y =
        cy +
        Math.sin(a) * (r + wave + fracture)

      if(a===0)
        ctx.moveTo(x,y)
      else
        ctx.lineTo(x,y)
    }

    ctx.strokeStyle =
      `rgba(120,255,180,${
        0.006 + i*0.008
      })`

    ctx.stroke()
  }

  /* collapsing vectors */

  for(let i=0;i<120;i++){

    const theta =
      i/120 * Math.PI*2 +
      phase*0.2

    const inner =
      size*0.04

    const outer =
      size*(
        0.36 +
        bassSmooth*0.14
      )

    const instability =
      Math.sin(
        theta*8 +
        phase*3
      ) *
      highSmooth *
      30

    ctx.beginPath()

    ctx.moveTo(
      cx + Math.cos(theta)*inner,
      cy + Math.sin(theta)*inner
    )

    ctx.lineTo(
      cx + Math.cos(theta)*(outer + instability),
      cy + Math.sin(theta)*(outer + instability)
    )

    ctx.strokeStyle =
      `rgba(120,255,180,${
        0.006 + highSmooth*0.05
      })`

    ctx.stroke()
  }

  /* main trace */

  const scale =
    size *
    (0.13 + bassSmooth*0.12)

  const A =
    3 + midSmooth*2.4

  const B =
    2 + highSmooth*3

  ctx.save()

  ctx.translate(
    cx +
    Math.sin(frame*0.0003)*24,

    cy +
    Math.cos(frame*0.0002)*18
  )

  ctx.rotate(
    Math.sin(frame*0.0001)*0.3
  )

  for(let pass=0; pass<5; pass++){

    ctx.beginPath()

    const alpha =
      pass===0 ? 0.02 :
      pass===1 ? 0.06 :
      pass===2 ? 0.14 :
      pass===3 ? 0.32 :
      0.95

    const spread =
      1 + pass*0.06

    for(let i=0;i<=2600;i++){

      const p =
        i / 2600

      const theta =
        phase +
        p * Math.PI * 2.8

      const distortion =

        Math.sin(
          theta *
          (30 + highSmooth*40) +
          frame * 0.005
        ) *

        highSmooth * 40

      const snap =

        Math.round(
          Math.sin(
            theta*14 +
            phase
          ) * 8
        ) / 8

      const x =

        Math.sin(
          A * theta +
          bassSmooth*2
        ) *

        scale *
        spread +

        distortion +

        snap * highSmooth * 16

      const y =

        Math.sin(
          B * theta +
          midSmooth*1.5
        ) *

        scale *
        0.84 *
        spread

      if(i===0)
        ctx.moveTo(x,y)
      else
        ctx.lineTo(x,y)
    }

    ctx.strokeStyle =
      `rgba(120,255,180,${alpha})`

    ctx.lineWidth =
      pass===4
        ? 2 + bassSmooth*5
        : .8

    ctx.shadowBlur =
      pass===4
        ? 24 + bassSmooth*40
        : 0

    ctx.shadowColor =
      "#00ff88"

    ctx.stroke()
  }

  ctx.restore()

  ctx.restore()
}

function loop(){

  frame++

  drawBG()

  drawFragilityField()

  if(bassSmooth > .65){

    document.body.style.transform =

      `translate(${
        (Math.random()-.5)*6
      }px,${
        (Math.random()-.5)*6
      }px)`

  }else{

    document.body.style.transform =
      "translate(0,0)"
  }

  subs.style.transform =
    `scaleY(${1 + bassSmooth*0.05})`

  subs.style.opacity =
    `${0.7 + bassSmooth*0.3}`

  requestAnimationFrame(loop)
}

loop()

</script>

</body>
</html>
